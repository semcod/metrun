[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metrun"
version = "0.1.15"
description = "Execution Intelligence Tool — Bottleneck Engine + Human Report Generator"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
keywords = ["profiling", "performance", "bottleneck", "tracing", "flamegraph"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "click>=7.0",
    "goal>=2.1.218",
    "costs>=0.1.20",
]

[project.optional-dependencies]
flamegraph = ["flameprof>=0.4"]
dev = ["pytest>=7", "flameprof>=0.4",
    "goal>=2.1.218",
    "costs>=0.1.20",
]

[project.scripts]
metrun = "metrun.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["metrun*"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }
